<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Belajar dan Bermain Bersama Bu Kholis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Konsep: kuis petualangan 6 pos bersama maskot katak Si Kodi. Satu kartu soal di tengah, gambar peta, rantai makanan, dan siklus air digambar sendiri. Tema hijau daun, teal air, dan kuning matahari (sengaja satu tema IPAS). */
:root{
  --blue:#12A39A; --blue-deep:#0A6F69; --blue-soft:#DDF4F1;
  --sun:#FFC933; --sun-deep:#C98F00; --sun-soft:#FFF0B8;
  --coral:#FF6B5E; --coral-soft:#FFE6E2; --coral-deep:#C73E32;
  --mint:#3FAE49; --mint-soft:#E0F6D8;
  --ink:#14333A; --muted:#4F6F73; --paper:#F1FAF6; --card:#FFFFFF; --line:#CDE9E3;
  --font-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:17px; line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px; margin:0;
  background-image:radial-gradient(circle at 10% 15%,rgba(255,201,51,.22) 0 80px,transparent 81px),radial-gradient(circle at 93% 62%,rgba(18,163,154,.13) 0 130px,transparent 131px),radial-gradient(circle at 70% 94%,rgba(255,107,94,.14) 0 70px,transparent 71px);
  background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blue-deep)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));background:linear-gradient(180deg,var(--blue) 0,var(--blue-deep) 100%);color:#fff;box-shadow:0 4px 0 var(--sun)}
.top-in{max-width:760px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.12rem;display:flex;align-items:center;gap:8px;margin-right:auto}
.score{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:999px;font-weight:800;font-variant-numeric:tabular-nums}
.tgl{border:2px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem;min-height:36px}
.tgl[aria-pressed="true"]{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.prog{flex-basis:100%;height:12px;background:rgba(0,0,0,.25);border-radius:999px;overflow:hidden}
.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),#FFE17A);border-radius:999px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
main{padding-top:20px}

/* pecahan */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.1;margin:0 3px;font-weight:800}
.fr i{font-style:normal;padding:0 3px}
.fr i:first-child{border-bottom:2px solid currentColor}

/* splash */
.splash{text-align:center;padding:26px 10px 10px}
.splash h1{font-size:clamp(2rem,8vw,3.2rem);font-weight:700}
.splash h1 em{font-style:normal;color:var(--blue);background:linear-gradient(transparent 62%,var(--sun) 62%)}
.splash p{margin:8px auto 18px;max-width:40ch;color:var(--muted);font-weight:700}
.splash .tiny{font-size:.9rem;margin-top:14px}
.splash-m{display:flex;justify-content:center}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* home */
.hero{background:linear-gradient(160deg,var(--blue) 0,var(--blue-deep) 100%);color:#fff;border-radius:28px;padding:24px 22px 26px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;box-shadow:0 8px 0 var(--sun-deep)}
.hero h1{font-size:clamp(1.7rem,6vw,2.5rem);font-weight:700}
.hero h1 em{font-style:normal;color:var(--sun)}
.hero p{margin:8px 0 0}
.ops{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.ops span{width:50px;height:50px;border-radius:16px;background:#fff;color:var(--blue);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:1.6rem;box-shadow:0 4px 0 rgba(0,0,0,.18);animation:bob 2.6s ease-in-out infinite}
.ops span:nth-child(2n){background:var(--sun);color:var(--ink);animation-delay:.3s}
.ops span:nth-child(3n){background:var(--coral);color:#fff;animation-delay:.6s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px;margin-top:20px}
.panel h2{font-size:1.25rem;margin-bottom:10px}
label.f{display:block;font-weight:800;margin-bottom:6px}
.inp{width:100%;font:inherit;padding:12px 14px;border:3px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);min-height:48px}
.inp:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 4px var(--blue-soft)}
textarea.inp{min-height:120px;resize:vertical}
.btn{border:0;border-radius:18px;padding:13px 24px;font-family:var(--font-display);font-weight:600;font-size:1.1rem;min-height:50px;transition:transform .15s,box-shadow .15s}
.btn-gold{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-deep)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--sun-deep)}
.btn-gold:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun-deep)}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-deep)}
.btn-blue:hover{transform:translateY(-2px)}
.btn-blue:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-deep)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-line{background:#fff;border:3px solid var(--line);color:var(--ink)}
.big-btn{font-size:1.4rem;padding:16px 34px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:10px}
.stg{text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;transition:transform .15s,border-color .15s}
.stg:hover{transform:translateY(-3px);border-color:var(--blue)}
.stg b{font-family:var(--font-display);font-size:1.02rem}
.stg small{color:var(--muted);font-weight:600}

/* soal */
.qhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.badge{background:var(--sun);color:var(--ink);font-family:var(--font-display);font-weight:600;border-radius:999px;padding:5px 14px;font-size:.95rem}
.qno{font-weight:800;color:var(--blue-deep);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:22px 20px;box-shadow:0 6px 0 var(--line);animation:rise .4s ease both}
.ctx{background:var(--sun-soft);border-left:8px solid var(--sun);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-weight:600}
.pic{display:flex;justify-content:center;margin:0 0 14px}
.pic svg{max-width:100%;height:auto;border-radius:20px}
.tblw{overflow-x:auto;margin:0 0 14px}
.tbl{border-collapse:separate;border-spacing:0;width:100%;max-width:420px;margin:0 auto;border:3px solid var(--blue);border-radius:16px;overflow:hidden;font-weight:700}
.tbl th{background:var(--blue);color:#fff;font-family:var(--font-display);padding:8px 12px;text-align:left}
.tbl td{padding:8px 12px;border-top:2px solid var(--line);background:#fff;font-variant-numeric:tabular-nums}
.tbl tr:nth-child(even) td{background:var(--blue-soft)}
.qtext{font-size:1.25rem;font-weight:600;margin-bottom:16px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:3px solid var(--line);border-radius:18px;padding:11px 14px;min-height:54px;font-weight:700;transition:transform .15s,border-color .15s,background .15s;overflow-wrap:anywhere}
.opt:hover:not([disabled]){transform:translateY(-2px) scale(1.01);border-color:var(--blue)}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:700}
.opt .t{padding-top:3px}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{background:var(--mint-soft);border-color:var(--mint);box-shadow:0 0 0 4px rgba(63,174,73,.28);animation:pop .5s ease}
.opt.ok .l{background:var(--mint)}
.opt.no{background:var(--coral-soft);border-color:var(--coral);border-style:dashed}
.opt.no .l{background:var(--coral)}
.opt.ok .t::after{content:" ✓ benar";color:var(--mint);font-weight:800}
.opt.no .t::after{content:" ✗ belum tepat";color:var(--coral-deep);font-weight:800}
.opt[disabled]{cursor:default}
.bs{grid-template-columns:1fr 1fr}
.bs .opt{justify-content:center;align-items:center;font-family:var(--font-display);font-size:1.3rem;min-height:68px}
.hint{color:var(--muted);font-weight:700;margin:0 0 10px}

/* jodoh */
.rows{display:grid;gap:8px;margin-bottom:14px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:8px;align-items:stretch}
.mleft{background:var(--blue);color:#fff;border-radius:14px;padding:10px 12px;font-weight:800;display:flex;align-items:center;overflow-wrap:anywhere}
.mslot{background:#fff;border:3px dashed var(--line);border-radius:14px;padding:8px 10px;text-align:left;font-weight:700;min-height:48px;color:var(--muted);overflow-wrap:anywhere}
.mslot.act{border-color:var(--sun);background:var(--sun-soft);color:var(--ink)}
.mslot.fill{border-style:solid;border-color:var(--blue);color:var(--ink);background:var(--blue-soft)}
.mslot.ok{border-style:solid;border-color:var(--mint);background:var(--mint-soft);color:var(--ink)}
.mslot.no{border-style:solid;border-color:var(--coral);background:var(--coral-soft);color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.chip{background:#fff;border:3px solid var(--line);border-radius:14px;padding:9px 12px;text-align:left;font-weight:800;display:flex;gap:10px;align-items:center;overflow-wrap:anywhere}
.chip b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-family:var(--font-display)}
.chip:hover:not([disabled]){border-color:var(--blue);transform:translateY(-2px)}
.chip[disabled]{opacity:.4}
.actions{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cnt{font-weight:800;color:var(--blue-deep)}
.chk{display:grid;gap:8px;margin:12px 0}
.chk label{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--blue);margin-top:2px}
.key{background:var(--sun-soft);border-radius:16px;padding:12px 14px;margin:12px 0;font-weight:600}

/* umpan balik */
.fb{margin-top:18px;background:#fff;border:3px solid var(--mint);border-radius:26px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:start;animation:rise .4s ease both;box-shadow:0 6px 0 #2C8736}
.fb.hug{border-color:var(--coral);box-shadow:0 6px 0 var(--coral-deep)}
.bubble h3{font-size:1.3rem;color:var(--mint)}
.fb.hug .bubble h3{color:var(--coral-deep)}
.bubble p{margin:4px 0 0}
.chipscore{display:inline-block;background:var(--sun);color:var(--ink);font-weight:800;border-radius:999px;padding:2px 12px;margin-top:6px}
.exp{grid-column:1/-1;background:var(--paper);border-radius:16px;padding:12px 14px}
.exp b{color:var(--blue-deep)}
.fb .btn{grid-column:1/-1;justify-self:end}
.intro{text-align:center;padding:28px 20px}
.intro h2{font-size:1.7rem;margin:8px 0}
.intro p{max-width:46ch;margin:6px auto 18px}
.res{text-align:center}
.big{font-family:var(--font-display);font-weight:700;font-size:4.2rem;line-height:1;color:var(--blue);font-variant-numeric:tabular-nums}
.big small{font-size:1.4rem;color:var(--muted)}
.bars{display:grid;gap:10px;text-align:left;margin:18px 0}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-weight:800}
.bar i{grid-column:1/-1;display:block;height:14px;border-radius:999px;background:var(--blue-soft);overflow:hidden}
.bar i b{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--mint));border-radius:999px;width:0;transition:width 1s ease}

/* maskot */
.mascot{display:block;overflow:visible}
.mascot .eh,.mascot .brows,.mascot .beak-open{display:none}
.mood-happy .en,.mood-hug .eh{display:none}
.mood-happy .eh,.mood-happy .beak-open{display:block}
.mood-hug .brows{display:block}
.mood-happy{animation:hop .6s ease 3}
.mood-hug{animation:sway 1.3s ease-in-out 2;transform-origin:50% 90%}
.mood-idle{animation:float 3s ease-in-out infinite}
.mood-happy .wL{transform-origin:52px 130px;animation:flapL .3s ease 6}
.mood-happy .wR{transform-origin:148px 130px;animation:flapR .3s ease 6}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) rotate(-3deg)}70%{transform:translateY(0) rotate(3deg)}}
@keyframes sway{0%,100%{transform:rotate(0)}30%{transform:rotate(-6deg)}70%{transform:rotate(6deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes flapL{50%{transform:rotate(-24deg)}}
@keyframes flapR{50%{transform:rotate(24deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (max-width:520px){
  body{font-size:16px}
  .hero{grid-template-columns:1fr;text-align:center;justify-items:center}
  .ops{justify-content:center}
  .mrow{grid-template-columns:1fr}
  .fb{grid-template-columns:1fr;justify-items:center;text-align:center}
  .fb .btn{justify-self:stretch}
  .exp{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<div class="top"><div class="top-in">
  <div class="brand" id="brand"></div>
  <div class="score" id="score" aria-live="polite"></div>
  <button class="tgl" id="tSound" aria-pressed="true" type="button">Efek suara: nyala</button>
  <button class="tgl" id="tVoice" aria-pressed="true" type="button">Suara ucapan: nyala</button>
  <div class="prog" role="progressbar" aria-label="Kemajuan kuis" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progWrap"><i id="prog"></i></div>
</div></div>
<div class="wrap"><main id="app"></main></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
"use strict";
/* ===================== DATA SOAL ===================== */
const STAGES={
  A:{id:'A',pos:'Pos 1',name:'Pilih Satu Jawaban',from:1,to:20,help:'Baca soal dan perhatikan gambarnya, lalu pilih satu jawaban yang paling tepat.'},
  B:{id:'B',pos:'Pos 2',name:'Benar atau Salah',from:21,to:25,help:'Baca teks kasus, lalu tentukan pernyataan itu Benar atau Salah.'},
  C:{id:'C',pos:'Pos 3',name:'Menjodohkan',from:26,to:30,help:'Ketuk pernyataan di kiri, lalu ketuk pilihan jawaban yang cocok. Ada satu pilihan yang tidak terpakai.'},
  D:{id:'D',pos:'Pos 4',name:'Pilih 3 Jawaban',from:31,to:35,help:'Pilih tepat 3 jawaban yang benar dari 6 pilihan.'},
  E:{id:'E',pos:'Pos 5',name:'Isian Singkat',from:36,to:45,help:'Ketik jawaban singkat pada kotak yang tersedia.'},
  F:{id:'F',pos:'Pos 6',name:'Uraian',from:46,to:50,help:'Tulis jawabanmu, lalu bandingkan dengan kunci dan centang bagian yang sudah kamu tulis dengan benar.'}
};
const Q=[];
const pg=(n,q,o,k,e,x)=>Q.push(Object.assign({n,t:'pg',st:'A',q,o,k,e,max:1},x||{}));
const bs=(n,q,k,e,x)=>Q.push(Object.assign({n,t:'bs',st:'B',q,o:['Benar','Salah'],k:k?0:1,e,max:1},x||{}));
const mt=(n,q,rows,ch,key,e)=>Q.push({n,t:'mt',st:'C',q,rows,ch,key,e,max:3});
const pk=(n,q,o,key,e,x)=>Q.push(Object.assign({n,t:'pk',st:'D',q,o,key,e,max:3},x||{}));
const fi=(n,q,ok,model,e,x)=>Q.push(Object.assign({n,t:'fi',st:'E',q,ok,model,e,max:2},x||{}));
const ur=(n,q,pts,model,x)=>Q.push(Object.assign({n,t:'ur',st:'F',q,pts,model,max:5},x||{}));

/* ---- Pos 1: pilihan ganda ---- */
pg(1,'Benua yang ditandai huruf A dan huruf B berturut-turut adalah ....',['Afrika dan Amerika','Australia dan Asia','Asia dan Australia','Eropa dan Australia'],2,'Indonesia diapit Benua Asia di sebelah utara (A) dan Benua Australia di sebelah selatan (B).',{img:'peta_benua',c:'Perhatikan peta berikut! Indonesia terletak di antara dua benua.'});
pg(2,'Samudra yang ditandai angka 1 dan angka 2 berturut-turut adalah ....',['Samudra Pasifik dan Samudra Hindia','Samudra Hindia dan Samudra Pasifik','Samudra Atlantik dan Samudra Pasifik','Samudra Hindia dan Samudra Atlantik'],1,'Samudra Hindia ada di sebelah barat daya (1), sedangkan Samudra Pasifik ada di sebelah timur Indonesia (2).',{img:'peta_samudra',c:'Perhatikan peta berikut! Indonesia juga terletak di antara dua samudra.'});
pg(3,'Dampak positif posisi geografis Indonesia bagi masyarakat dari kegiatan tersebut adalah ....',['Wilayah Indonesia menjadi lebih sering dilanda gempa bumi','Semua barang di Indonesia menjadi lebih mahal','Masyarakat tidak perlu bekerja karena semua kebutuhan sudah terpenuhi','Terbuka banyak lapangan kerja dan usaha di sekitar pelabuhan, seperti jasa angkut dan perdagangan'],3,'Kapal dagang yang singgah membuat pelabuhan ramai, sehingga muncul lapangan kerja dan usaha seperti jasa angkut dan perdagangan.',{img:'kapal',c:'Setiap hari ratusan kapal dagang dari berbagai negara melewati perairan Indonesia dan singgah di pelabuhan-pelabuhan besar untuk membongkar dan memuat barang.'});
pg(4,'Karakteristik iklim di wilayah tersebut adalah ....',['iklim tropis dengan dua musim, yaitu hujan dan kemarau','iklim sedang dengan empat musim','iklim dingin dengan salju sepanjang tahun','iklim kering tanpa hujan sepanjang tahun'],0,'Wilayah di sekitar garis khatulistiwa beriklim tropis, yaitu hanya punya dua musim: hujan dan kemarau.',{img:'musim',c:'Pak Tani yang tinggal di wilayah yang dilalui garis khatulistiwa menanam padi saat musim hujan dan menanam jagung saat musim kemarau. Pergantian musim ini terjadi teratur setiap tahun.'});
pg(5,'Pengaruh kondisi geografis tersebut terhadap bidang ekonomi penduduk desa adalah ....',['Penduduk banyak bertani padi di lereng gunung','Penduduk kesulitan mendapatkan sumber makanan','Sebagian besar penduduk bekerja sebagai nelayan dan pengolah hasil laut','Penduduk bermata pencaharian utama beternak sapi perah'],2,'Daerah pesisir dekat dengan laut yang kaya ikan, sehingga banyak penduduk menjadi nelayan dan mengolah hasil laut.',{img:'pesisir',c:'Desa Bahari terletak di tepi pantai. Sebagian besar wilayahnya berupa pantai berpasir dengan laut yang luas dan kaya ikan.'});
pg(6,'Kegiatan ekonomi yang dilakukan warga tersebut adalah ....',['konsumsi','produksi','distribusi','jasa'],1,'Mengolah bahan baku (singkong) menjadi barang jadi (keripik) adalah kegiatan produksi.',{c:'Ibu Siti dan beberapa tetangganya mengolah singkong (bahan baku) menjadi keripik singkong (barang jadi) untuk memenuhi kebutuhan hidup keluarga.'});
pg(7,'Peran Pak Rahmat dalam kegiatan ekonomi tersebut adalah sebagai ....',['produsen','konsumen','pengolah bahan baku','distributor'],3,'Pak Rahmat menyalurkan jeruk dari petani ke kota lain. Orang yang menyalurkan barang disebut distributor.',{c:'Pak Rahmat membeli hasil panen jeruk dari para petani di desanya, lalu mengirimkannya dengan truk ke kota lain untuk dijual kembali di toko-toko.'});
pg(8,'Dalam kegiatan tersebut, Bu Dewi berperan sebagai ....',['konsumen','produsen','distributor','penyedia bahan baku'],0,'Bu Dewi membeli dan memakai barang untuk memenuhi kebutuhan keluarga, jadi ia berperan sebagai konsumen.',{img:'pasar',c:'Setiap pagi Bu Dewi pergi ke pasar tradisional untuk membeli sayur, ikan, dan beras untuk dimasak keluarganya.'});
pg(9,'Jenis kegiatan ekonomi yang dilakukan Pak Joko adalah ....',['konsumsi barang','distribusi hasil bumi','produksi bahan pangan','jasa pengangkutan'],2,'Menyemai, menanam, merawat, dan memanen padi berarti menghasilkan barang, yaitu produksi bahan pangan.',{c:'Pak Joko membudidayakan padi di sawah. Ia menyemai bibit, menanam, merawat, dan memanen padi hingga menghasilkan gabah.'});
pg(10,'Tindakan ekonomi yang paling tepat untuk meningkatkan nilai guna tomat tersebut adalah ....',['menjual tomat dengan harga sangat murah secepat mungkin','mengolah tomat menjadi saus atau sambal kemasan yang lebih tahan lama','menyimpan tomat di tempat terbuka sampai seluruhnya terjual','berhenti menanam tomat selamanya'],1,'Mengolah tomat menjadi saus atau sambal kemasan membuatnya lebih awet, sehingga nilai gunanya meningkat.',{c:'Di Desa Sukamaju, petani tomat panen melimpah. Namun harga tomat turun dan tomat mudah busuk, sehingga banyak tomat terbuang percuma.'});
pg(11,'Kesatuan interaksi antara komponen hidup dan tak hidup di lingkungan tersebut disebut ....',['populasi','komunitas','habitat','ekosistem'],3,'Satuan interaksi antara komponen hidup (biotik) dan tak hidup (abiotik) disebut ekosistem.',{c:'Di sebuah sawah terdapat padi, belalang, katak, air irigasi, tanah, dan sinar matahari. Semua unsur itu saling berinteraksi dan membentuk satu kesatuan.'});
pg(12,'Kelompok unsur yang termasuk komponen produsen beserta perannya adalah ....',['rumput, pohon mangga, dan jagung; berperan menghasilkan makanan sendiri bagi makhluk hidup lain','belalang, burung, dan rumput; berperan memakan makhluk hidup lain','rumput dan belalang; berperan menguraikan sisa makhluk hidup','pohon mangga, burung, dan jagung; berperan mengubah sampah menjadi tanah'],0,'Rumput, pohon mangga, dan jagung berwarna hijau dan membuat makanan sendiri, jadi mereka produsen.',{c:'Perhatikan data hasil pengamatan di sebuah kebun berikut!',tbl:{head:['Unsur','Hasil pengamatan'],rows:[['Rumput','Berwarna hijau, membuat makanan sendiri dengan bantuan cahaya matahari'],['Belalang','Memakan daun rumput'],['Pohon mangga','Berwarna hijau, membuat makanan sendiri dengan bantuan cahaya matahari'],['Burung','Memakan buah dan serangga'],['Jagung','Berwarna hijau, membuat makanan sendiri dengan bantuan cahaya matahari']]}});
pg(13,'Jika populasi ular menurun drastis karena diburu manusia, yang kemungkinan terjadi pada organisme lain dalam rantai makanan tersebut adalah ....',['Populasi tikus menurun dan padi bertambah','Populasi padi dan tikus sama-sama bertambah','Populasi tikus meningkat, sedangkan padi berkurang','Populasi elang bertambah karena makanannya melimpah'],2,'Jika ular berkurang, tikus tidak banyak dimangsa sehingga jumlahnya meningkat dan padi yang dimakan makin banyak.',{img:'rantai',c:'Perhatikan rantai makanan berikut! Anak panah menunjukkan arah perpindahan energi.'});
pg(14,'Hubungan antara lebah dan bunga pada ilustrasi tersebut termasuk bentuk simbiosis ....',['parasitisme','mutualisme','komensalisme','kompetisi'],1,'Lebah mendapat nektar dan bunga terbantu penyerbukan. Kedua pihak untung, jadi disebut mutualisme.',{img:'lebah',c:'Perhatikan ilustrasi berikut!'});
pg(15,'Dampak perburuan tersebut terhadap keseimbangan ekosistem pertanian di sekitarnya adalah ....',['Populasi tikus berkurang sehingga padi tumbuh subur','Jumlah padi bertambah karena tidak ada pemangsa','Rantai makanan menjadi lebih seimbang','Populasi tikus meningkat sehingga banyak padi rusak dan petani terancam gagal panen'],3,'Tanpa ular, tikus berkembang pesat dan merusak padi, sehingga petani bisa gagal panen.',{c:'Warga sebuah desa memburu ular sawah secara liar untuk dijual. Dalam beberapa bulan, ular sawah di area persawahan hampir punah.'});
pg(16,'Peristiwa tersebut sesuai dengan tahapan siklus air yang disebut ....',['evaporasi (penguapan)','kondensasi','presipitasi','infiltrasi'],0,'Air pada pakaian berubah menjadi uap air karena panas matahari. Peristiwa ini disebut evaporasi.',{img:'jemuran',c:'Setelah dicuci, pakaian basah dijemur di bawah terik matahari. Beberapa jam kemudian pakaian menjadi kering karena air berubah wujud menjadi uap air.'});
pg(17,'Peristiwa tersebut ditunjukkan oleh nomor dan disebut ....',['nomor 2, presipitasi','nomor 3, presipitasi','nomor 3, kondensasi','nomor 1, evaporasi'],1,'Turunnya titik-titik air dari awan disebut presipitasi dan ditunjukkan oleh nomor 3.',{img:'siklus',c:'Perhatikan gambar skema siklus air berikut! Titik-titik air jatuh dari awan ke permukaan bumi dalam bentuk hujan.'});
pg(18,'Peristiwa tersebut ditunjukkan oleh nomor dan disebut ....',['nomor 3, infiltrasi','nomor 5, infiltrasi','nomor 4, infiltrasi','nomor 4, kondensasi'],2,'Meresapnya air hujan ke dalam tanah disebut infiltrasi dan ditunjukkan oleh nomor 4.',{img:'siklus',c:'Perhatikan gambar skema siklus air berikut! Air hujan meresap ke dalam lapisan tanah dan menjadi air tanah.'});
pg(19,'Hal ini terjadi karena ....',['air hanya ada di laut dan tidak pernah berubah','manusia selalu membuat air baru di pabrik','air yang dipakai akan hilang ke luar angkasa','air terus berputar melalui proses daur air sehingga selalu tersedia'],3,'Air tidak hilang, tetapi terus berputar dalam daur air: menguap, menjadi awan, turun sebagai hujan, lalu kembali ke bumi.',{c:'Meskipun digunakan manusia setiap hari, air di permukaan bumi tidak habis.'});
pg(20,'Upaya paling tepat untuk menjaga ketersediaan air tanah di lingkungan tersebut adalah ....',['membuat lubang resapan biopori dan sumur resapan di halaman dan pinggir jalan','membangun lebih banyak jalan beton agar air cepat mengalir','menyedot air tanah lebih banyak dengan pompa','menutup seluruh halaman dengan semen agar bersih'],0,'Biopori dan sumur resapan membantu air hujan meresap ke tanah, sehingga cadangan air tanah bertambah dan banjir berkurang.',{c:'Di sebuah perumahan padat, hampir seluruh tanah ditutup beton dan paving. Saat hujan, air cepat mengalir ke selokan dan terjadi banjir, sedangkan sumur warga mengering saat kemarau.'});

/* ---- Pos 2: benar / salah ---- */
bs(21,'Pembuangan sampah rumah tangga ke sungai mencemari air dan mengancam kelangsungan hidup biota sungai.',true,'Benar. Sampah rumah tangga yang dibuang ke sungai mencemari air, sehingga ikan dan biota sungai terancam.',{img:'sungai_kotor',c:'Warga di tepi Sungai Bening terbiasa membuang sampah rumah tangga, seperti bungkus plastik dan sisa makanan, langsung ke sungai. Beberapa bulan kemudian air sungai menjadi keruh dan berbau. Banyak ikan mati dan mengambang di permukaan air.'});
bs(22,'Memilah sampah organik dan anorganik tidak berpengaruh terhadap pengurangan pencemaran lingkungan.',false,'Salah. Memilah sampah memudahkan pengolahan: sampah organik jadi kompos dan anorganik didaur ulang, sehingga pencemaran berkurang.',{c:'Warga RW 05 menyediakan dua tempat sampah. Tempat sampah hijau untuk sisa sayur dan daun, sedangkan tempat sampah kuning untuk plastik, kaleng, dan kertas. Sisa sayur dijadikan kompos, sedangkan plastik dan kaleng disetor ke bank sampah.'});
bs(23,'Penerapan prinsip 3R efektif menjaga keseimbangan ekosistem sungai karena mengurangi sampah plastik yang masuk ke sungai.',true,'Benar. Prinsip 3R (reduce, reuse, recycle) mengurangi sampah plastik yang masuk ke sungai, sehingga ekosistem sungai pulih.',{img:'sungai_bersih',c:'Sungai Harapan penuh sampah plastik. Warga lalu menerapkan prinsip 3R. Mereka mengurangi kantong plastik dengan membawa tas belanja sendiri (reduce), memakai ulang botol dan wadah (reuse), serta mengolah sampah plastik menjadi tas dan pot (recycle). Beberapa bulan kemudian sungai menjadi bersih dan ikan kembali berkembang biak.'});
bs(24,'Air tidak dibutuhkan tumbuhan dalam proses fotosintesis dan pengangkutan zat hara.',false,'Salah. Air dibutuhkan tumbuhan untuk fotosintesis dan untuk mengangkut zat hara ke seluruh tubuh.',{c:'Tumbuhan menyerap air dari dalam tanah melalui akar. Air tanah ini berasal dari air hujan yang meresap ke dalam tanah pada siklus air. Air membantu tumbuhan mengangkut zat hara ke seluruh bagian tubuh dan menjadi bahan untuk membuat makanan (fotosintesis).'});
bs(25,'Berkurangnya pepohonan di bukit resapan air membuat cadangan air tanah menurun sehingga warga kekurangan air bersih saat kemarau.',true,'Benar. Pohon membantu menyimpan air di tanah. Jika pohon berkurang, cadangan air tanah menurun dan mata air mengering.',{img:'bukit',c:'Bukit Mata Air dahulu ditumbuhi banyak pohon. Kini banyak pohon ditebang untuk lahan permukiman. Saat musim kemarau, mata air di kaki bukit debitnya mengecil dan akhirnya mengering. Warga kesulitan mendapatkan air bersih untuk minum dan memasak.'});

/* ---- Pos 3: menjodohkan ---- */
mt(26,'Jodohkan pernyataan berikut dengan sebutan karakteristik negara yang sesuai!',['Sebagian besar penduduknya bekerja sebagai petani','Sebagian besar penduduknya bekerja di bidang kelautan, misalnya nelayan','Sebagian besar penduduknya bekerja di pabrik dan industri'],['Negara industri','Negara agraris','Negara maritim','Negara pertambangan'],[1,2,0],'Petani = negara agraris. Nelayan = negara maritim. Pekerja pabrik = negara industri. Negara pertambangan tidak dipakai.');
mt(27,'Jodohkan kondisi wilayah Indonesia berikut dengan sebutan yang sesuai!',['Luas wilayah perairan (laut) lebih besar daripada luas daratan','Terdiri atas belasan ribu pulau yang dikelilingi laut','Dilalui garis khatulistiwa sehingga beriklim panas dan lembap'],['Negara tropis','Negara agraris','Negara kepulauan','Negara maritim'],[3,2,0],'Laut lebih luas = negara maritim. Ribuan pulau = negara kepulauan. Dilalui khatulistiwa = negara tropis.');
mt(28,'Keluarga Pak Anton mendahulukan pembelian kebutuhan pokok sebelum membeli barang pelengkap. Jodohkan contoh pembelian berikut dengan jenis kebutuhannya!',['Membeli beras, sayur, dan lauk','Membeli kipas angin dan sepeda','Membeli perhiasan emas dan mobil mewah'],['Kebutuhan tersier','Kebutuhan primer','Kebutuhan rohani','Kebutuhan sekunder'],[1,3,0],'Beras, sayur, dan lauk = primer. Kipas angin dan sepeda = sekunder. Perhiasan emas dan mobil mewah = tersier.');
mt(29,'Warga membuka lahan di lereng bukit dengan menebang pohon secara liar tanpa menanam kembali (reboisasi). Jodohkan akibat berikut dengan dampak kerusakan lingkungannya!',['Tanah di lereng bukit meluncur ke bawah saat hujan deras','Air hujan meluap dan menggenangi permukiman di dataran rendah','Mata air mengering saat musim kemarau'],['Kekeringan dan krisis air','Gempa bumi','Banjir','Tanah longsor'],[3,2,0],'Tanah meluncur = tanah longsor. Air meluap ke dataran rendah = banjir. Mata air mengering = kekeringan dan krisis air.');
mt(30,'Jodohkan karakteristik limbah berikut dengan kategori sampahnya!',['Mudah diuraikan mikroorganisme, contohnya sisa sayur dan daun kering','Sulit terurai di alam, contohnya botol dan kantong plastik','Sulit terurai dan berbahaya, contohnya baterai bekas dan lampu neon'],['Limbah B3 (bahan berbahaya dan beracun)','Sampah organik','Sampah cair','Sampah anorganik'],[1,3,0],'Sisa sayur = organik. Plastik = anorganik. Baterai dan lampu neon = limbah B3.');

/* ---- Pos 4: PG kompleks ---- */
pk(31,'Indonesia terletak di antara dua benua (Asia dan Australia) dan dua samudra (Hindia dan Pasifik). Pilihlah tiga dampak positif dari letak geografis tersebut!',['Menjadi jalur pelayaran dan perdagangan internasional yang strategis','Mengalami musim dingin bersalju setiap tahun','Memudahkan hubungan ekonomi dan budaya dengan banyak negara','Sulit menjalin hubungan dagang dengan negara lain','Memiliki potensi kekayaan laut yang besar karena berbatasan dengan dua samudra','Wilayah lautnya tidak menyimpan sumber daya alam'],[0,2,4],'Dampak positifnya: jalur pelayaran dan perdagangan yang strategis, hubungan ekonomi dan budaya dengan banyak negara, serta kekayaan laut.');
pk(32,'Perhatikan contoh aktivitas ekonomi masyarakat berikut. Pilihlah tiga kegiatan yang termasuk kegiatan distribusi!',['Petani memanen padi di sawah','Pedagang menjual sayur kepada pembeli di pasar','Pengrajin membuat gerabah dari tanah liat','Sopir truk mengangkut beras dari desa ke kota','Keluarga membeli beras untuk dimasak','Agen mengirim hasil pertanian ke toko-toko di kota lain'],[1,3,5],'Menjual, mengangkut, dan mengirim barang termasuk distribusi. Memanen dan membuat gerabah adalah produksi, sedangkan membeli adalah konsumsi.');
pk(33,'Perhatikan pernyataan tentang ekosistem sawah berikut. Pilihlah tiga contoh hubungan ketergantungan antara komponen biotik dan abiotik!',['Padi memerlukan cahaya matahari untuk membuat makanan','Ular memakan tikus di sawah','Padi menyerap air dan unsur hara dari tanah','Ikan sawah memerlukan air untuk hidup dan bernapas','Katak memakan serangga kecil','Elang memangsa ular sawah'],[0,2,3],'Padi dan cahaya matahari, padi dan tanah, serta ikan dan air adalah hubungan makhluk hidup dengan benda tak hidup. Pilihan lain adalah hubungan antarmakhluk hidup.');
pk(34,'Perhatikan daftar kegiatan manusia di sekitar hutan berikut. Pilihlah tiga aktivitas yang mengancam kelestarian dan keseimbangan ekosistem hutan!',['Menebang pohon secara liar','Menanam kembali pohon yang telah ditebang','Membakar hutan untuk membuka lahan perkebunan','Mengikuti patroli penjaga hutan','Memburu satwa langka untuk dijual','Membuang sampah pada tempatnya'],[0,2,4],'Penebangan liar, pembakaran hutan, dan perburuan satwa langka mengancam kelestarian hutan.');
pk(35,'Perhatikan kebiasaan di lingkungan tempat tinggal berikut. Pilihlah tiga tindakan yang mendukung pelestarian dan ketersediaan cadangan air bersih!',['Membuang sampah ke selokan dan sungai','Membuat lubang resapan biopori di halaman','Membiarkan keran air menyala saat menggosok gigi','Menanam dan merawat pohon di sekitar rumah','Menampung air hujan untuk menyiram tanaman','Menutup seluruh tanah halaman dengan semen'],[1,3,4],'Biopori, pohon, dan penampungan air hujan membantu menambah dan menjaga cadangan air bersih.');

ur(46,'Indonesia terletak pada posisi silang, yaitu di antara dua benua (Asia dan Australia) dan dua samudra (Hindia dan Pasifik). Analisislah alasan letak geografis Indonesia tersebut memberikan keuntungan strategis dalam kegiatan perdagangan dunia!',[['Indonesia berada di jalur silang pelayaran dunia (antara dua benua dan dua samudra)',1],['Kapal dagang antarbenua melewati perairan Indonesia',1],['Pelabuhan Indonesia menjadi tempat singgah dan bongkar muat barang',1],['Memudahkan ekspor, impor, dan kerja sama dagang dengan banyak negara',1],['Membuka lapangan kerja dan meningkatkan pendapatan masyarakat dan negara',1]],'Indonesia berada di jalur silang pelayaran dunia sehingga kapal dagang antarbenua melewati perairan kita. Pelabuhan menjadi ramai, ekspor dan impor mudah, serta lapangan kerja dan pendapatan bertambah.',{img:'peta_silang'});
ur(47,'Jelaskan tiga pelaku utama kegiatan ekonomi di masyarakat beserta contoh perannya dalam kehidupan sehari-hari!',[['Produsen disebut dengan benar',1],['Distributor disebut dengan benar',1],['Konsumen disebut dengan benar',1],['Contoh peran yang tepat untuk sekurang-kurangnya satu pelaku',1],['Contoh peran yang tepat untuk ketiga pelaku',1]],'Produsen menghasilkan barang, misalnya petani menanam padi. Distributor menyalurkan barang, misalnya pedagang atau sopir truk. Konsumen membeli dan memakai barang, misalnya keluarga yang berbelanja di pasar.');
ur(48,'Di ekosistem sawah, ular dan elang memangsa tikus. Warga yang memburu ular dan elang membuat jumlah pemangsa tikus berkurang. Analisislah pentingnya peran konsumen puncak, seperti elang, dalam mengendalikan populasi dan menjaga keseimbangan ekosistem!',[['Konsumen puncak memangsa konsumen di bawahnya, misalnya ular dan tikus',1],['Pemangsa mengendalikan jumlah populasi mangsa agar tidak berlebihan',1],['Tanpa pemangsa, populasi tikus meledak dan merusak padi sehingga gagal panen',1],['Rantai makanan terganggu dan keseimbangan ekosistem hilang',1],['Kesimpulan: hewan pemangsa perlu dilindungi dan tidak boleh diburu',1]],'Elang sebagai konsumen puncak memangsa ular dan tikus sehingga jumlah mereka terkendali. Tanpa elang, tikus berkembang pesat, padi rusak, dan keseimbangan ekosistem terganggu. Karena itu hewan pemangsa perlu dilindungi.');
ur(49,'Air laut menguap karena panas matahari, kemudian turun sebagai hujan di daratan. Uraikan tahapan utama siklus air tersebut secara berurutan!',[['Penguapan (evaporasi) air laut akibat panas matahari',1],['Uap air naik, mendingin, lalu mengembun (kondensasi) membentuk awan',1],['Awan terbawa angin ke daratan',1],['Hujan turun (presipitasi)',1],['Air meresap ke tanah atau mengalir ke sungai lalu kembali ke laut',1]],'Air laut menguap karena panas matahari. Uap air naik, mengembun menjadi awan, lalu awan terbawa angin ke daratan. Awan menurunkan hujan, kemudian air meresap ke tanah atau mengalir ke sungai dan kembali ke laut.',{img:'siklus'});
ur(50,'Air bersih semakin berharga karena sumber air tercemar dan jumlahnya berkurang. Usulkan tiga tindakan nyata yang dapat kamu lakukan di rumah untuk menghemat dan menjaga ketersediaan air bersih, lalu jelaskan alasan setiap tindakan tersebut!',[['Tindakan nyata pertama tepat',1],['Tindakan nyata kedua tepat',1],['Tindakan nyata ketiga tepat',1],['Alasan yang tepat untuk sekurang-kurangnya satu tindakan',1],['Alasan yang tepat untuk ketiga tindakan',1]],'Contoh: menutup keran saat tidak dipakai (agar air tidak terbuang), menampung air hujan (menambah persediaan air), membuat biopori (menambah air tanah), memperbaiki keran bocor, dan tidak membuang sampah ke sungai (agar air tidak tercemar).');

const frame=(inner,label,h)=>{h=h||180;return `<svg width="340" height="${h}" viewBox="0 0 340 ${h}" role="img" aria-label="${label}"><rect width="340" height="${h}" rx="22" fill="#E8F7F4"/>${inner}</svg>`;};
const tx=(x,y,s,o)=>{o=o||{};return `<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" font-family="Fredoka,Trebuchet MS,sans-serif" font-weight="600" font-size="${o.s||15}" fill="${o.c||'#14333A'}">${s}</text>`;};
const badge=(x,y,s)=>`<circle cx="${x}" cy="${y}" r="14" fill="#12A39A" stroke="#fff" stroke-width="3"/>`+tx(x,y+5,s,{c:'#fff',s:15});
const cloud=(x,y,c)=>`<g fill="${c||'#fff'}"><circle cx="${x-24}" cy="${y+8}" r="16"/><circle cx="${x}" cy="${y-6}" r="22"/><circle cx="${x+26}" cy="${y+8}" r="16"/><rect x="${x-38}" y="${y+6}" width="80" height="18" rx="9"/></g>`;
const sunA=(x,y,r)=>{let ry='';for(let i=0;i<8;i++){const a=i*Math.PI/4;ry+=`<line x1="${(x+Math.cos(a)*(r+4)).toFixed(1)}" y1="${(y+Math.sin(a)*(r+4)).toFixed(1)}" x2="${(x+Math.cos(a)*(r+11)).toFixed(1)}" y2="${(y+Math.sin(a)*(r+11)).toFixed(1)}" stroke="#FFC933" stroke-width="3.5" stroke-linecap="round"/>`;}return ry+`<circle cx="${x}" cy="${y}" r="${r}" fill="#FFC933"/>`;};

const wave=(y,c)=>`<path d="M0 ${y} q20 -9 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="${c||'#fff'}" stroke-width="3" opacity=".75"/>`;

function peta(mode){
  const E=(cx,cy,rx,ry,a)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(${a} ${cx} ${cy})" fill="#FFC933" stroke="#C98F00" stroke-width="3"/>`;

  if(mode==='benua'){s+=badge(96,40,'A')+badge(264,164,'B');}
  else if(mode==='samudra'){s+=badge(44,152,'1')+badge(298,64,'2');}
  else{s+=tx(112,42,'Benua Asia',{s:13})+tx(268,176,'Benua Australia',{s:12})+tx(46,132,'Samudra',{s:12})+tx(46,148,'Hindia',{s:12})+tx(298,60,'Samudra',{s:12})+tx(298,76,'Pasifik',{s:12})+
    MK('ar0')+'<path d="M60 176 C110 150 130 130 150 118" fill="none" stroke="#E7503F" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ar0)"/><path d="M290 96 C250 130 220 150 190 150" fill="none" stroke="#E7503F" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ar0)"/>';}
  const lbl={benua:'Peta Indonesia dengan dua benua bertanda A dan B',samudra:'Peta Indonesia dengan dua samudra bertanda 1 dan 2',silang:'Peta posisi silang Indonesia antara dua benua dan dua samudra'}[mode];
  return frame(s,lbl,200);
}

function tone(f,t0,d,type,vol){const c=ac();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;const t=c.currentTime+t0;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);}catch(e){}}
function sfx(kind){
  if(!state.sound)return;
  if(kind==='win'){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.09,.35,'triangle',.22));tone(1568,.42,.3,'sine',.12);tone(2093,.5,.4,'sine',.09);}
  else if(kind==='hug'){[392,440,523.25].forEach((f,i)=>tone(f,i*.2,.6,'sine',.2));tone(659.25,.62,.7,'sine',.12);}
  else if(kind==='click'){tone(660,0,.08,'sine',.12);}
  else if(kind==='fanfare'){[523.25,659.25,783.99,1046.5,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,i*.14,.4,'triangle',.22));}
  else if(kind==='stage'){[587.33,739.99,880].forEach((f,i)=>tone(f,i*.1,.3,'triangle',.18));}
  else if(kind==='cheer'){[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,i*.11,.4,'triangle',.22));[784,1046.5,1568].forEach((f,i)=>tone(f,.62+i*.1,.45,'sine',.14));}
  else if(kind==='hello'){[392,523.25,659.25,783.99].forEach((f,i)=>tone(f,i*.12,.3,'triangle',.2));}
}

const cv=document.getElementById('fx'),cx=cv.getContext('2d');let parts=[],raf=0;
function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
addEventListener('resize',fit);fit();
function burst(kind){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const n=reduce?0:(kind==='big'?220:kind==='win'?110:18);
  for(let i=0;i<n;i++){
    if(kind==='hug'){parts.push({k:'star',x:Math.random()*innerWidth,y:innerHeight+10,vx:(Math.random()-.5)*.8,vy:-(1.2+Math.random()*1.6),g:-0.004,r:8+Math.random()*8,a:1,rot:Math.random()*6,life:150});}
    else{const c=['#12A39A','#FFC933','#FF6B5E','#3FAE49','#FFFFFF'][Math.floor(Math.random()*5)];const ox=kind==='big'?Math.random()*innerWidth:innerWidth/2;parts.push({k:'sq',c,x:ox,y:kind==='big'?-10:innerHeight*.35,vx:(Math.random()-.5)*(kind==='big'?4:11),vy:kind==='big'?Math.random()*3:-(4+Math.random()*8),g:.28,r:5+Math.random()*6,a:1,rot:Math.random()*6,vr:(Math.random()-.5)*.3,life:kind==='big'?200:100});}
  }
  if(!raf)raf=requestAnimationFrame(loop);
}
function star(x,y,r,rot){cx.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5,rr=i%2?r*.45:r;cx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}cx.closePath();cx.fill();}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.life--;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr||.03;p.a=Math.min(1,p.life/40);cx.globalAlpha=p.a;
    if(p.k==='star'){cx.fillStyle='#FFC933';star(p.x,p.y,p.r,p.rot);}else{cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillRect(-p.r/2,-p.r/3,p.r,p.r*.66);cx.restore();}}
  cx.globalAlpha=1;
  raf=parts.length?requestAnimationFrame(loop):0;
}

function bodyChoice(q,box){

function resolve(q,score,detail){
  if(state.answered)return;state.answered=true;
  state.res[q.n]={s:score,m:q.max};header();
  const full=score===q.max,part=score>0&&!full;
  const line=full?pick(PUJI):(part?pick(SEBAGIAN):pick(SEMANGAT));
  const title=full?(q.max>1?'Sempurna, '+who()+'!':'Benar, '+who()+'!'):(part?'Sedikit lagi, '+who()+'!':'Ayo semangat, '+who()+'!');
  sfx(full?'win':'hug');burst(full?'win':'hug');say(line);
  const last=state.idx===state.list.length-1;
  $('#fb').innerHTML=`<div class="fb ${full?'':'hug'}" role="status">
    ${mascot(full?'happy':'hug',92)}
    <div class="bubble"><h3>${esc(title)}</h3><p>${esc(line)}</p><span class="chipscore">+${score} dari ${q.max} poin</span></div>
    <div class="exp">${detail?detail+'<br>':''}<b>Pembahasan:</b> ${M(q.e||'')}</div>
    <button class="btn btn-gold" id="nx" type="button">${last?'Lihat hasilku':'Lanjut'}</button></div>`;
  const nx=$('#nx');nx.onclick=()=>{sfx('click');try{speechSynthesis.cancel()}catch(e){}if(last)results();else{state.idx++;show();}};
  setTimeout(()=>{const f=$('#fb');if(f)f.scrollIntoView({behavior:'smooth',block:'nearest'});nx.focus({preventScroll:true});},60);
}

/* ===================== HASIL ===================== */
function results(){
  const tot=total(),got=earned();const pct=Math.round(got/tot*100);
  const grade=pct>=90?['Juara IPAS','Luar biasa! Kamu menguasai hampir semuanya.']:pct>=75?['Bintang Alam','Bagus sekali! Sedikit lagi menuju juara.']:pct>=60?['Penjelajah Cilik','Kamu sudah baik. Ayo ulangi pos yang belum sempurna.']:['Calon Juara','Jangan menyerah! Belajar lagi, lalu coba kembali ya.'];
  const stages=[...new Set(state.list.map(q=>q.st))];
  const bars=stages.map(id=>{const qs=state.list.filter(q=>q.st===id);const m=qs.reduce((a,q)=>a+q.max,0);const s=qs.reduce((a,q)=>a+(state.res[q.n]?state.res[q.n].s:0),0);return `<div class="bar"><span>${STAGES[id].pos}: ${STAGES[id].name}</span><span>${s} / ${m}</span><i><b data-w="${Math.round(s/m*100)}"></b></i></div>`;}).join('');
  const stars=pct>=90?3:pct>=75?2:1;
  const medal=`<svg width="120" height="130" viewBox="0 0 120 130" role="img" aria-label="Medali ${grade[0]}"><path d="M34 0 L58 50 L40 54 L16 6Z" fill="#0A6F69"/><path d="M86 0 L62 50 L80 54 L104 6Z" fill="#FF6B5E"/><circle cx="60" cy="82" r="40" fill="#FFC933" stroke="#C98F00" stroke-width="5"/><circle cx="60" cy="82" r="30" fill="none" stroke="#FFF0B8" stroke-width="3" stroke-dasharray="3 5"/><path d="M60 62 L66 77 L82 78 L70 88 L74 104 L60 95 L46 104 L50 88 L38 78 L54 77Z" fill="#12A39A"/></svg>`;
  const sm=Array.from({length:3},(_,i)=>`<svg width="30" height="30" viewBox="0 0 40 40" style="margin:0 3px;opacity:${i<stars?1:.25}"><path d="M20 3 L25 15 L38 16 L28 25 L31 38 L20 31 L9 38 L12 25 L2 16 L15 15Z" fill="#FFC933"/></svg>`).join('');
  scrollTop();
  app.innerHTML=`<section class="card res"><div class="row" style="justify-content:center;gap:6px">${medal}${mascot('happy',110)}</div>
    <h2 style="margin-top:6px">${esc(grade[0])}, ${esc(who())}!</h2><div>${sm}</div>
    <p>${esc(grade[1])}</p>
    <div class="big"><span id="cnt">0</span><small> / ${tot}</small></div>
    <div class="bars">${bars}</div>
    <div class="row" style="justify-content:center"><button class="btn btn-gold" id="again" type="button">Main lagi</button><button class="btn btn-line" id="menu" type="button">Pilih pos latihan</button></div></section>`;
  const line=pct>=60?'Selamat '+who()+'! Nilaimu '+got+'. Kamu hebat!':'Terima kasih sudah berjuang, '+who()+'. Nilaimu '+got+'. Ayo belajar lagi, kamu pasti bisa!';
  sfx(pct>=60?'fanfare':'hug');burst(pct>=60?'big':'hug');say(line);
  let n=0;const el=$('#cnt');const iv=setInterval(()=>{n=Math.min(got,n+Math.max(1,Math.round(got/40)));el.textContent=n;if(n>=got)clearInterval(iv);},30);
  setTimeout(()=>app.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%'),80);
  $('#again').onclick=()=>{ac();sfx('click');start(state.mode);};
  $('#menu').onclick=()=>{sfx('click');home();};
}

/* ===================== KONTROL SUARA ===================== */
$('#tSound').onclick=function(){state.sound=!state.sound;this.setAttribute('aria-pressed',state.sound);this.textContent='Efek suara: '+(state.sound?'nyala':'mati');ac();if(state.sound)sfx('click');};
$('#tVoice').onclick=function(){state.voice=!state.voice;this.setAttribute('aria-pressed',state.voice);this.textContent='Suara ucapan: '+(state.voice?'nyala':'mati');if(!state.voice){try{speechSynthesis.cancel()}catch(e){}}else say('Suara ucapan menyala.',100);};
try{if('speechSynthesis' in window)speechSynthesis.getVoices();}catch(e){}
splash();
</script>
